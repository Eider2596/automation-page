trigger-e2e:
  needs: deploy-pages
  runs-on: ubuntu-latest
  steps:
    - name: Dispatch E2E tests
      run: |
        curl -X POST \
          -H "Authorization: Bearer ${{ secrets.TESTS_REPO_TOKEN }}" \
          -H "Accept: application/vnd.github+json" \
          https://api.github.com/repos/TU_USUARIO/REPO_DE_TESTS/dispatches \
          -d '{"event_type":"app-deployed"}'