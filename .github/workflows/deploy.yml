name: CI/CD — Deploy AutoShop QA Lab to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Job 1: Quality Gate / Smoke Check (Ready for Playwright/Cypress/Selenium E2E tests)
  verify-project:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify required static files exist
        run: |
          test -f index.html
          test -f iframe-content.html
          test -f css/styles.css
          test -f js/app.js
          test -f js/store.js
          echo "All core application files verified!"

  # Job 2: Automatic Deployment to GitHub Pages
  deploy-pages:
    needs: verify-project
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
